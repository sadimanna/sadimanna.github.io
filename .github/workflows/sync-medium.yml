name: Sync Medium posts

on:
  schedule:
    # Run once every Sunday at midnight UTC (weekly)
    - cron: "0 0 * * 0"
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install feedparser markdownify requests beautifulsoup4

      - name: Pull new Medium posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIUM_USER: mannasiladittya
          OUT_DIR: content/posts
        run: python sync_medium.py

      - name: Check for new posts or changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New posts or changes detected."
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Set up Node.js
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.check_changes.outputs.changed == 'true'
        run: npm ci

      - name: Build static site
        if: steps.check_changes.outputs.changed == 'true'
        run: npm run predeploy

      - name: Deploy to GitHub Pages
        if: steps.check_changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

      - name: Commit and push changes to repository
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts public/images/blog public/rss.xml public/atom.xml
          git commit -m "chore: sync new Medium posts and update RSS feed [skip ci]"

          # Attempt direct push to main first
          if git push origin main; then
            echo "Successfully pushed new posts directly to main."
          else
            echo "Direct push to main failed. Creating/updating Pull Request..."
            git checkout -b sync-medium-posts
            git push -f origin sync-medium-posts
            gh pr create \
              --title "chore: sync new Medium posts" \
              --body "Automated sync of new Medium posts. The live site has been rebuilt and deployed to GitHub Pages." \
              --head sync-medium-posts \
              --base main || echo "Pull Request is already open or was updated."
          fi
