name: Update Google Scholar Citations

on:
  schedule:
    # Run once every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Scholar data
        run: node scripts/fetch-scholar-data.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/citations.json
          if git diff --staged --quiet; then
            echo "No citation changes detected."
          else
            git commit -m "chore: automated update of Google Scholar citations data [skip ci]"
            git push
          fi
